name: Portfolio API checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Audit API dependency tree
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: node --check src/controllers/site-config.controller.js
      - run: node --check src/app.js
      - name: Audit published project evidence and live demo endpoints
        run: node scripts/audit-live-showcase.js
