# Render Blueprint for the Developer Portfolio API.
# Secrets are marked `sync: false`: Render prompts for them in the dashboard,
# so no secret values ever live in this repository.
services:
  - type: web
    name: portfolio-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CLIENT_ORIGIN
        value: https://oboikanyego-portfolio.netlify.app
      - key: DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
      - key: SITE_CONFIG_CACHE_TTL_MS
        value: "300000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false # Must match the existing Atlas database before switching
      - key: CLOUDINARY_CLOUD_NAME
        value: dv2hhefed
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NETLIFY_BUILD_HOOK_URL
        sync: false # Secret URL created in Netlify → project configuration → build hooks
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_RECEIVER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      # Owner-only FCM web configuration and private service credentials.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_VAPID_PUBLIC_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
